name: Build APK from HTML

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Create Android Project Structure & Set Icon
      run: |
        mkdir -p android-app/app/src/main/assets
        mkdir -p android-app/app/src/main/java/com/example/htmlapp
        mkdir -p android-app/app/src/main/res/values
        mkdir -p android-app/app/src/main/res/mipmap-hdpi
        mkdir -p android-app/app/src/main/res/mipmap-xxxhdpi

        # Copy web files to assets
        cp -r index.html android-app/app/src/main/assets/ || true
        cp -r *.css android-app/app/src/main/assets/ 2>/dev/null || true
        cp -r *.js android-app/app/src/main/assets/ 2>/dev/null || true

        # Copy user uploaded icon (icon.png) to mipmap if exists
        if [ -f "icon.png" ]; then
          cp icon.png android-app/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp icon.png android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp icon.png android-app/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp icon.png android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
        fi

        # Create AndroidManifest.xml
        cat << 'EOF' > android-app/app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
            <uses-feature android:name="android.hardware.camera" android:required="false" />
            <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />
            
            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:roundIcon="@mipmap/ic_launcher"
                android:label="AGRIO"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # Create strings.xml
        cat << 'EOF' > android-app/app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">AGRIO</string>
        </resources>
        EOF

        # Create MainActivity.java with WebView WebChromeClient for Camera Permissions
        cat << 'EOF' > android-app/app/src/main/java/com/example/htmlapp/MainActivity.java
        package android.content.pm;
        package com.example.htmlapp;
        
        import android.Manifest;
        import android.content.pm.PackageManager;
        import android.os.Bundle;
        import android.webkit.PermissionRequest;
        import android.webkit.WebChromeClient;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import androidx.annotation.NonNull;
        import androidx.appcompat.app.AppCompatActivity;
        import androidx.core.app.ActivityCompat;
        import androidx.core.content.ContextCompat;

        public class MainActivity extends AppCompatActivity {
            private WebView mywebView;
            private static final int CAMERA_PERMISSION_REQUEST_CODE = 100;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                
                // Request Android OS Camera Permission
                if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                    ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.CAMERA}, CAMERA_PERMISSION_REQUEST_CODE);
                }

                mywebView = new WebView(this);
                WebSettings webSettings = mywebView.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webSettings.setDomStorageEnabled(true);
                webSettings.setAllowFileAccess(true);
                webSettings.setMediaPlaybackRequiresUserGesture(false);

                mywebView.setWebViewClient(new WebViewClient());
                
                // Allow WebView to grant camera permission requests from web content (HTML)
                mywebView.setWebChromeClient(new WebChromeClient() {
                    @Override
                    public void onPermissionRequest(final PermissionRequest request) {
                        runOnUiThread(new Runnable() {
                            @Override
                            public void run() {
                                request.grant(request.getResources());
                            }
                        });
                    }
                });

                mywebView.loadUrl("file:///android_asset/index.html");
                setContentView(mywebView);
            }

            @Override
            public void onBackPressed() {
                if (mywebView.canGoBack()) {
                    mywebView.goBack();
                } else {
                    super.onBackPressed();
                }
            }
        }
        EOF

        # Create build.gradle
        cat << 'EOF' > android-app/app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.example.htmlapp'
            compileSdk 34
            defaultConfig {
                applicationId "com.example.htmlapp"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
        }
        EOF

        # Create settings.gradle
        echo "include ':app'" > android-app/settings.gradle

        # Create root build.gradle
        cat << 'EOF' > android-app/build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.1'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # Create gradle.properties
        echo "android.useAndroidX=true" > android-app/gradle.properties

    - name: Build APK with Gradle
      working-directory: android-app
      run: |
        gradle wrapper --gradle-version 8.4
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android-app/app/build/outputs/apk/debug/app-debug.apk
