name: Build APK from HTML

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Create Android Project Structure
      run: |
        mkdir -p android-app/app/src/main/assets
        mkdir -p android-app/app/src/main/java/com/example/htmlapp
        mkdir -p android-app/app/src/main/res/layout
        mkdir -p android-app/app/src/main/res/mipmap-hdpi

        # Copy web files to assets
        cp -r index.html android-app/app/src/main/assets/ || true
        cp -r *.css android-app/app/src/main/assets/ 2>/dev/null || true
        cp -r *.js android-app/app/src/main/assets/ 2>/dev/null || true

        # Create AndroidManifest.xml
        cat << 'EOF' > android-app/app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="WMS App"
                android:roundIcon="@mipmap/ic_launcher"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # Create MainActivity.java
        cat << 'EOF' > android-app/app/src/main/java/com/example/htmlapp/MainActivity.java
        package com.example.htmlapp;
        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {
            private WebView mywebView;
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                mywebView = new WebView(this);
                WebSettings webSettings = mywebView.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webSettings.setDomStorageEnabled(true);
                mywebView.setWebViewClient(new WebViewClient());
                mywebView.loadUrl("file:///android_asset/index.html");
                setContentView(mywebView);
            }
            @Override
            public void onBackPressed() {
                if (mywebView.canGoBack()) {
                    mywebView.goBack();
                } else {
                    super.onBackPressed();
                }
            }
        }
        EOF

        # Create build.gradle
        cat << 'EOF' > android-app/app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.example.htmlapp'
            compileSdk 34
            defaultConfig {
                applicationId "com.example.htmlapp"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
        }
        EOF

        # Create settings.gradle
        echo "include ':app'" > android-app/settings.gradle

        # Create root build.gradle
        cat << 'EOF' > android-app/build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.0'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # Create gradle.properties
        echo "android.useAndroidX=true" > android-app/gradle.properties

    - name: Build APK with Gradle
      working-directory: android-app
      run: |
        chmod +x gradlew || gradle wrapper
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android-app/app/build/outputs/apk/debug/app-debug.apk
